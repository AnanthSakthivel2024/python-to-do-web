<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TODO App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    {% block body %}{% endblock %}

    <!-- ═══════════════════════════════════════════════════════
         ADD TASK MODAL
    ════════════════════════════════════════════════════════ -->
    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg" style="border-radius:16px; border:none;">

                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-plus-circle text-primary me-2"></i>Add New Task
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <form method="POST" action="/home">
                    <div class="modal-body pt-3">

                        <!-- Task name -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Task <span class="text-danger">*</span></label>
                            <input
                                type="text"
                                name="task"
                                class="form-control"
                                placeholder="What do you need to do?"
                                required
                            >
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea
                                name="description"
                                class="form-control"
                                placeholder="Add more details (optional)"
                                rows="2"
                            ></textarea>
                        </div>

                        <!-- Date + Due Time -->
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                                <input
                                    type="date"
                                    name="date"
                                    id="addDate"
                                    class="form-control"
                                    required
                                >
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Due Time</label>
                                <input
                                    type="time"
                                    name="due_time"
                                    class="form-control"
                                >
                            </div>
                        </div>

                        <!-- Priority -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Priority</label>
                            <select name="priority" class="form-select">
                                <option value="Low">🟢 Low</option>
                                <option value="Medium" selected>🟡 Medium</option>
                                <option value="High">🔴 High</option>
                            </select>
                        </div>

                        <!-- Completed checkbox -->
                        <div class="form-check">
                            <input
                                type="checkbox"
                                name="completed"
                                id="addCompleted"
                                class="form-check-input"
                            >
                            <label class="form-check-label" for="addCompleted">
                                Mark as completed
                            </label>
                        </div>

                    </div>

                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-plus-lg me-1"></i>Add Task
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         EDIT TASK MODAL
    ════════════════════════════════════════════════════════ -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg" style="border-radius:16px; border:none;">

                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-pencil-square text-warning me-2"></i>Edit Task
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <form method="POST" id="editForm" action="">
                    <div class="modal-body pt-3">

                        <!-- Task name -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Task <span class="text-danger">*</span></label>
                            <input
                                type="text"
                                name="task"
                                id="editTask"
                                class="form-control"
                                required
                            >
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea
                                name="description"
                                id="editDescription"
                                class="form-control"
                                rows="2"
                            ></textarea>
                        </div>

                        <!-- Date + Due Time -->
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                                <input
                                    type="date"
                                    name="date"
                                    id="editDate"
                                    class="form-control"
                                    required
                                >
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Due Time</label>
                                <input
                                    type="time"
                                    name="due_time"
                                    id="editDueTime"
                                    class="form-control"
                                >
                            </div>
                        </div>

                        <!-- Priority -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Priority</label>
                            <select name="priority" id="editPriority" class="form-select">
                                <option value="Low">🟢 Low</option>
                                <option value="Medium">🟡 Medium</option>
                                <option value="High">🔴 High</option>
                            </select>
                        </div>

                        <!-- Completed checkbox -->
                        <div class="form-check">
                            <input
                                type="checkbox"
                                name="completed"
                                id="editCompleted"
                                class="form-check-input"
                            >
                            <label class="form-check-label" for="editCompleted">
                                Mark as completed
                            </label>
                        </div>

                    </div>

                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-warning px-4 fw-semibold">
                            <i class="bi bi-save me-1"></i>Save Changes
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- Flash messages (toast) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
                {% for category, message in messages %}
                    <div class="toast align-items-center text-bg-{{ category }} border-0 show" role="alert">
                        <div class="d-flex">
                            <div class="toast-body">{{ message }}</div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-dismiss toasts after 3s
        document.querySelectorAll('.toast').forEach(t => {
            setTimeout(() => new bootstrap.Toast(t).hide(), 3000);
        });

        // Set today's date as default in Add modal
        document.getElementById('addDate').value =
            new Date().toISOString().split('T')[0];

        // Populate Edit modal with task data
        function setEditData(btn) {
            const id          = btn.dataset.id;
            const date        = btn.dataset.date;
            const task        = btn.dataset.task;
            const description = btn.dataset.description;
            const priority    = btn.dataset.priority;
            const dueTime     = btn.dataset.dueTime;
            const completed   = btn.dataset.completed === "True";

            // Set form action to the correct edit URL
            document.getElementById('editForm').action = '/edit/' + id;

            // Fill fields
            document.getElementById('editTask').value        = task;
            document.getElementById('editDescription').value = description || '';
            document.getElementById('editDate').value        = date;
            document.getElementById('editDueTime').value     = dueTime || '';
            document.getElementById('editCompleted').checked = completed;

            // Set correct priority option
            const prioritySelect = document.getElementById('editPriority');
            for (let option of prioritySelect.options) {
                option.selected = option.value === priority;
            }
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
