{% extends "base.html" %}
{% block title %}Login — TODO App{% endblock %}

{% block body %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg auth-card">
        <div class="card-body p-5">

            <div class="text-center mb-4">
                <div class="app-icon mb-3">
                    <i class="bi bi-check2-square"></i>
                </div>
                <h2 class="fw-bold">Welcome back</h2>
                <p class="text-muted">Log in to your TODO account</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Log In
                </button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted mb-0">
                Don't have an account?
                <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Register here</a>
            </p>

        </div>
    </div>
</div>
{% endblock %}
