{% extends "base.html" %}
{% block title %}Register — TODO App{% endblock %}

{% block body %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg auth-card">
        <div class="card-body p-5">

            <div class="text-center mb-4">
                <div class="app-icon mb-3">
                    <i class="bi bi-person-plus"></i>
                </div>
                <h2 class="fw-bold">Create account</h2>
                <p class="text-muted">Sign up to start managing your tasks</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Choose a password" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="confirm" class="form-control" placeholder="Repeat your password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 btn-lg fw-semibold">
                    <i class="bi bi-person-check me-2"></i>Create Account
                </button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted mb-0">
                Already have an account?
                <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Log in here</a>
            </p>

        </div>
    </div>
</div>
{% endblock %}
